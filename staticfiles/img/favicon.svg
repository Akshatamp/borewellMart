<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5A8E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4E37;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#f8f9fa" stroke="#1E5A8E" stroke-width="2"/>

  <!-- Well structure -->
  <rect x="30" y="20" width="40" height="8" rx="2" fill="#2C3E50"/>

  <!-- Well shaft -->
  <rect x="35" y="28" width="30" height="35" fill="url(#groundGradient)" stroke="#5D4E37" stroke-width="1"/>

  <!-- Water at bottom -->
  <rect x="35" y="55" width="30" height="10" fill="url(#waterGradient)"/>

  <!-- Water drop -->
  <ellipse cx="50" cy="72" rx="6" ry="8" fill="#4A90D9"/>
  <ellipse cx="50" cy="70" rx="4" ry="5" fill="#6BA3E1"/>

  <!-- Drill pipe -->
  <rect x="47" y="25" width="6" height="40" fill="#708090" rx="1"/>

  <!-- Drill tip -->
  <polygon points="50,65 44,72 56,72" fill="#4A4A4A"/>

  <!-- Letter B -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E5A8E" text-anchor="middle">BM</text>
</svg>